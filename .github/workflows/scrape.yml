name: Scrape legacy WordPress site

# One-off: already ran. Re-run manually from the Actions tab only if the old site changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scrape/scrape.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add scrape-output public/media
          git commit -m "chore: scraped content and media from legacy site" || echo "nothing to commit"
          git push
